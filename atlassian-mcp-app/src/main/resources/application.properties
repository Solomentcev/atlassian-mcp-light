# Atlassian credentials are supplied through environment variables or .env.
jira.url=${JIRA_URL}
jira.email=${JIRA_EMAIL}
jira.token=${JIRA_TOKEN}
confluence.url=${CONFLUENCE_URL}

# Runtime limits (environment variables override these defaults).
mcp.max-text-length=${MCP_MAX_TEXT_LENGTH:4000}
mcp.max-response-bytes=${MCP_MAX_RESPONSE_BYTES:2097152}
