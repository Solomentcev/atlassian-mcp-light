version: '3.8'

services:
  atlassian-mcp-server:
    build: .
    image: atlassian-mcp-server:latest
    container_name: atlassian-mcp-server
    restart: unless-stopped
    # STDIO-транспорт использует stdin/stdout без псевдотерминала.
    stdin_open: true
    # Загружаем переменные окружения из .env (секреты не попадают в репозиторий)
    env_file:
      - .env
    # Явно указываем переменные окружения (опционально, можно задать через .env)
    environment:
      - ATLASSIAN_LOG_LEVEL=${ATLASSIAN_LOG_LEVEL:-INFO}
    # Логи в stdout/stderr (MCP-сервер использует stdout для JSON-RPC)
    # Логирование идёт в stderr, stdout остаётся чистым для протокола
    # Важно: не перенаправлять stdout в логи, иначе MCP-клиент не сможет разобрать ответы
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"