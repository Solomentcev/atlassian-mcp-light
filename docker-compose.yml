services:
  atlassian-mcp-server:
    build: .
    image: atlassian-mcp-server:latest
    # STDIO-транспорт использует stdin/stdout без псевдотерминала.
    stdin_open: true
    # Загружаем переменные окружения из .env (секреты не попадают в репозиторий).
    env_file:
      - .env
    environment:
      - ATLASSIAN_LOG_LEVEL=${ATLASSIAN_LOG_LEVEL:-INFO}
    # stdout зарезервирован для JSON-RPC, логи приложения направляются в stderr.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
